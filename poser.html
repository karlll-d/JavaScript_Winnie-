<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style2.css">
</head>
<body class ="poser-page">
     <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="home.html" class="logo">Genomic AMR Predictor</a>
      <ul class="nav-links">
        <li><a href="home.html">Accueil</a></li>
        <li><a href="about.html">À propos</a></li>

        <li><a href="poser.html"class="active">Poser une question</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>
  <main class="question-container">
    <div class="question-card">
        <h2>Poser une question</h2>
        <p class="subtitle">Envoyez votre question ou remarque directement à l'équipe de développement.</p>
        
        <form action="/api/send-question" method="POST" class="question-form">
            <div class="form-group">
                <label for="name">Nom complet</label>
                <input type="text" id="name" name="name" placeholder="Votre nom" required>
            </div>

            <div class="form-group">
                <label for="email">Adresse e-mail</label>
                <input type="email" id="email" name="email" placeholder="nom@exemple.com" required>
            </div>

            <div class="form-group">
                <label for="subject">Sujet</label>
                <input type="text" id="subject" name="subject" placeholder="Sujet de votre question" required>
            </div>

            <div class="form-group">
                <label for="message">Votre question / message</label>
                <textarea id="message" name="message" rows="5" placeholder="Écrivez votre message ici..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Envoyer le message</button>
        </form>
    </div>
</main>
</body>
</html>
